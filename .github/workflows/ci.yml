name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # dist/ is not committed; pg_lens_web's build.rs requires it
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/pg_lens_web/frontend/package-lock.json
      - name: Build frontend bundle
        run: npm ci && npm run build
        working-directory: crates/pg_lens_web/frontend
      - name: Tests
        run: cargo test --workspace
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check license compliance (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      - name: Verify THIRD_PARTY_LICENSES.md is up to date
        run: |
          python3 scripts/generate_licenses.py
          git diff --exit-code THIRD_PARTY_LICENSES.md
      - name: TUI-only build (no web feature)
        run: cargo build -p pg_lens_tui --no-default-features

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/pg_lens_web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/pg_lens_web/frontend/package-lock.json
      - run: npm ci
      # SQL tokenizer unit tests (node:test + native TS type-stripping)
      - run: npm test
      # runs `tsc --noEmit && vite build`
      - run: npm run build
